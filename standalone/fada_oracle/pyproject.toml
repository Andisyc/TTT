[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fada-oracle"
version = "0.1.0"
description = "Isolated official FADA distillation with a local motion-quality oracle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.0",
    "numpy==2.2.6",
    "mujoco==3.4.0",
    "h5py>=3.13,<4",
    "loguru>=0.7,<1",
    "omegaconf>=2.3,<3",
    "opencv-python-headless>=4.11,<5",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "pyzmq>=26,<28",
    "scipy>=1.15,<2",
    "shapely>=2,<3",
    "tensorboard>=2.19,<3",
    "tensordict>=0.8,<0.9",
    "tqdm>=4.67,<5",
    "trimesh>=4.6,<5",
    "tyro>=1.0,<2",
    "typing-extensions>=4.12,<5",
    "wandb==0.22.0",
    "warp-lang==1.10.0",
]

[project.optional-dependencies]
warp = [
    "mujoco-warp @ git+https://github.com/google-deepmind/mujoco_warp.git@09ec1da65ac44bd68703f9507c9c9e8f22ae7c71 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
fada-oracle = "fada_oracle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fada_oracle"]

[tool.hatch.build.targets.wheel.force-include]
"upstream_patches" = "fada_oracle/upstream_patches"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true


[tool.pytest.ini_options]
testpaths = ["tests"]
